<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="How I work: clear architecture, measurable behavior, repeatable delivery"><title>How I work: clear architecture, measurable behavior, repeatable delivery</title><rect x="0.75" y="0.75" width="1198.5" height="248.5" rx="14" fill="#11161d" stroke="#2b333d" stroke-width="1.5"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"><text x="34" y="51" fill="#a5b5cc" font-size="15" font-weight="500" >01 / ARCHITECTURE</text><text x="34" y="100" fill="#eff5ff" font-size="24" font-weight="600" >Separate responsibilities.</text><text x="34" y="144" fill="#a5b5cc" font-size="18" font-weight="400" >Controllers, services, middleware.</text><text x="34" y="177" fill="#a5b5cc" font-size="18" font-weight="400" >Domain logic behind clear boundaries.</text><text x="432" y="51" fill="#a5b5cc" font-size="15" font-weight="500" >02 / VERIFICATION</text><text x="432" y="100" fill="#eff5ff" font-size="24" font-weight="600" >Make behavior measurable.</text><text x="432" y="144" fill="#a5b5cc" font-size="18" font-weight="400" >API, UI, and scenario-based load tests.</text><text x="432" y="177" fill="#a5b5cc" font-size="18" font-weight="400" >Reusable flows for repeatable checks.</text><text x="830" y="51" fill="#a5b5cc" font-size="15" font-weight="500" >03 / DELIVERY</text><text x="830" y="100" fill="#eff5ff" font-size="24" font-weight="600" >Make releases repeatable.</text><text x="830" y="144" fill="#a5b5cc" font-size="18" font-weight="400" >Migrations, packages, and automation.</text><text x="830" y="177" fill="#a5b5cc" font-size="18" font-weight="400" >Build, install, test, and iterate.</text></g></svg>
