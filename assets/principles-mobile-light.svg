<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" aria-label="How I work: clear architecture, measurable behavior, repeatable delivery"><title>How I work: clear architecture, measurable behavior, repeatable delivery</title><rect x="0.75" y="0.75" width="678.5" height="638.5" rx="14" fill="#fafbfc" stroke="#d6dde5" stroke-width="1.5"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"><text x="38" y="51" fill="#51647d" font-size="21" font-weight="500" >01 / ARCHITECTURE</text><text x="38" y="100" fill="#14243c" font-size="32" font-weight="600" >Separate responsibilities.</text><text x="38" y="144" fill="#51647d" font-size="25" font-weight="400" >Controllers, services, middleware.</text><text x="38" y="177" fill="#51647d" font-size="25" font-weight="400" >Domain logic behind clear boundaries.</text><text x="38" y="259" fill="#51647d" font-size="21" font-weight="500" >02 / VERIFICATION</text><text x="38" y="308" fill="#14243c" font-size="32" font-weight="600" >Make behavior measurable.</text><text x="38" y="352" fill="#51647d" font-size="25" font-weight="400" >API, UI, and scenario-based load tests.</text><text x="38" y="385" fill="#51647d" font-size="25" font-weight="400" >Reusable flows for repeatable checks.</text><text x="38" y="467" fill="#51647d" font-size="21" font-weight="500" >03 / DELIVERY</text><text x="38" y="516" fill="#14243c" font-size="32" font-weight="600" >Make releases repeatable.</text><text x="38" y="560" fill="#51647d" font-size="25" font-weight="400" >Migrations, packages, and automation.</text><text x="38" y="593" fill="#51647d" font-size="25" font-weight="400" >Build, install, test, and iterate.</text></g></svg>
